<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <title>Unity WebGL Player | Mulberry Shades</title>

  <meta name="viewport"
        content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #unity-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #231F20;
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <script src="Build/Builds.loader.js"></script>

  <script>
    const canvas = document.querySelector("#unity-canvas");

    createUnityInstance(canvas, {
      dataUrl: "Build/Builds.data",
      frameworkUrl: "Build/Builds.framework.js",
      codeUrl: "Build/Builds.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "LifeVR",
      productName: "Mulberry Shades",
      productVersion: "0.1",
      matchWebGLToCanvasSize: true
    });
  </script>
</body>
</html>
